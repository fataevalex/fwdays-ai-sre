apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent
  namespace: argocd
spec:
  source:
    helm:
      valuesObject:
        otel:
          tracing:
            enabled: true
            exporter:
              otlp:
                endpoint: "http://phoenix-svc.phoenix.svc.cluster.local:4317"
                protocol: "grpc"
        providers:
          default: openAI
          openAI:
            provider: OpenAI
            model: "gpt-4o-mini"
            apiKey: "dummy"
            config:
              baseUrl: "http://agentgateway-proxy.agentgateway-system.svc.cluster.local:8080/v1"
        nodeSelector:
          node-pool: minipc
        controller:
          nodeSelector:
            node-pool: minipc
        ui:
          service:
            type: ClusterIP
          nodeSelector:
            node-pool: minipc
        kmcp:
          nodeSelector:
            node-pool: minipc
        kagent-tools:
          nodeSelector:
            node-pool: minipc
          tools:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
        grafana-mcp:
          nodeSelector:
            node-pool: minipc
          grafana:
            url: "http://grafana-service.monitoring.svc.cluster.local/api"
            secretRef: "grafana-mcp-credentials"
        tools:
          grafana-mcp:
            enabled: true
        querydoc:
          nodeSelector:
            node-pool: minipc
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
        agents:
          k8s-agent:
            enabled: true
          observability-agent:
            enabled: true
          kgateway-agent:
            enabled: false
          istio-agent:
            enabled: false
          promql-agent:
            enabled: true
          argo-rollouts-agent:
            enabled: false
          helm-agent:
            enabled: false
          cilium-policy-agent:
            enabled: false
          cilium-manager-agent:
            enabled: false
          cilium-debug-agent:
            enabled: false
  ignoreDifferences:
    - group: kagent.dev
      kind: Agent
      jsonPointers:
        - /spec/declarative/tools
    # The chart doesn't expose a values knob for grafana-mcp's container args,
    # so -allowed-hosts (needed to let mcp-grafana accept requests with a
    # non-localhost Host header, i.e. the in-cluster Service DNS name) is
    # patched onto the live Deployment and excluded from drift detection here.
    - group: apps
      kind: Deployment
      name: kagent-grafana-mcp
      jsonPointers:
        - /spec/template/spec/containers/0/args
    # Same reason: the chart renders kagent-builtin-prompts from its own
    # templates with no values override. Point 9 (discover identifiers,
    # don't guess them) is patched onto the live ConfigMap — without it,
    # agents guessed datasource UIDs like "loki" instead of calling
    # list_datasources first, and every Grafana/Loki-backed tool call failed.
    - group: ""
      kind: ConfigMap
      name: kagent-builtin-prompts
      jsonPointers:
        - /data/tool-usage-best-practices
