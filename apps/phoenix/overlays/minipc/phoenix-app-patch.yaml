apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phoenix
  namespace: argocd
spec:
  source:
    helm:
      valuesObject:
        deployment:
          nodeSelector:
            node-pool: minipc
        service:
          type: ClusterIP
        ingress:
          enabled: false
        auth:
          enableAuth: false
        image:
          tag: version-16.2.0-nonroot
        postgresql:
          resources:
            limits:
              cpu: "1000m"
              memory: "2Gi"
            requests:
              cpu: "200m"
              memory: "512Mi"
