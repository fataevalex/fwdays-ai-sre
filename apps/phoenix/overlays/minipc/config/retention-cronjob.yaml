apiVersion: batch/v1
kind: CronJob
metadata:
  name: phoenix-traces-retention
  namespace: phoenix
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: postgres:16-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: phoenix-postgresql
                      key: POSTGRES_PASSWORD
              command:
                - psql
                - -h
                - phoenix-postgresql
                - -U
                - postgres
                - -d
                - phoenix
                - -c
                - |
                  DO $$
                  DECLARE
                    deleted int;
                    total int := 0;
                  BEGIN
                    LOOP
                      DELETE FROM traces
                      WHERE id IN (
                        SELECT id FROM traces
                        WHERE start_time < NOW() - INTERVAL '3 days'
                        LIMIT 50000
                      );
                      GET DIAGNOSTICS deleted = ROW_COUNT;
                      total := total + deleted;
                      EXIT WHEN deleted = 0;
                      PERFORM pg_sleep(0.2);
                    END LOOP;
                    RAISE NOTICE 'Retention cleanup done. Deleted % rows.', total;
                  END;
                  $$;
