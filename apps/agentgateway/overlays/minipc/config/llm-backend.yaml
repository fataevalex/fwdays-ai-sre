apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  ai:
    groups:
      - providers:
          - name: openai-primary
            openai:
              model: gpt-4o-mini
            policies:
              auth:
                secretRef:
                  name: openai-secret
      - providers:
          - name: ollama-llama3-minipc2
            host: ollama.minipc2-ollama-amd.svc.cluster.local
            port: 11434
            openai:
              model: llama3.1:8b
          - name: ollama-llama3-home-pc
            host: 192.168.0.152
            port: 11434
            openai:
              model: llama3.1:8b
          - name: ollama-gemma3-4b
            host: ollama.minipc2-ollama-amd.svc.cluster.local
            port: 11434
            openai:
              model: gemma3:4b
          - name: ollama-gemma3-1b
            host: ollama.minipc2-ollama-amd.svc.cluster.local
            port: 11434
            openai:
              model: gemma3:1b
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - backendRefs:
        - name: llm
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
